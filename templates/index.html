<!doctype html><html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Novo Horizonte - Solicitações</title>
<style>
*{box-sizing:border-box}body{margin:0;font:16px system-ui,sans-serif;background:#f4f6f8;color:#1c2430}
header{background:#1f6f5c;color:#fff;padding:12px 16px}h1{margin:0 0 8px;font-size:1.2rem}
nav button{background:#ffffff33;color:#fff;border:0;padding:8px 14px;border-radius:8px;margin-right:6px;font-size:1rem}
nav button.on{background:#fff;color:#1f6f5c}main{max-width:720px;margin:auto;padding:14px}
input,select,textarea,button{font:inherit;width:100%;padding:11px;margin:4px 0;border:1px solid #c5ccd3;border-radius:8px;background:#fff}
button.p{background:#1f6f5c;color:#fff;border:0;font-weight:600}button.s{background:#e8edf1}
.card,.item{background:#fff;border-radius:10px;padding:12px;margin:10px 0;box-shadow:0 1px 3px #0001}
.row{display:flex;gap:8px}.msg{padding:12px;border-radius:8px;margin:10px 0}.ok{background:#d9f2e6}.er{background:#fbdcdc}
.hide{display:none}small{color:#566}
</style></head><body>
<header><h1>Novo Horizonte · Cozinha</h1><nav><button id="t1" class="on">Solicitar</button><button id="t2">Admin</button></nav></header>
<main>
<section id="p1">
 <label>Unidade<select id="un"></select></label>
 <label>Responsável<input id="resp" maxlength="100" placeholder="Seu nome"></label>
 <div id="itens"></div>
 <button type="button" class="s" id="add">+ Adicionar item</button>
 <label>Observações gerais<textarea id="og" rows="2" maxlength="1000"></textarea></label>
 <button class="p" id="env">Enviar solicitação</button><div id="m1"></div>
</section>
<section id="p2" class="hide">
 <div id="lg"><input id="u" placeholder="Usuário" autocomplete="username"><input id="s" type="password" placeholder="Senha" autocomplete="current-password">
 <button class="p" id="ent">Entrar</button><div id="m2"></div></div>
 <div id="ad" class="hide"><button class="s" id="sair">Sair</button><div id="lista"></div></div>
</section>
</main>
<script>
const $=i=>document.getElementById(i);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const CATS=['Alimentos','Hortifruti','Carnes','Limpeza','Descartáveis','Outros'],UM=['kg','g','L','un','pacote','caixa'],
ST=['Pendente','Em análise','Aprovada','Em separação','Atendida','Recusada'];
const opt=a=>a.map(c=>`<option>${c}</option>`).join('');
const api=async(u,m='GET',b)=>{const r=await fetch(u,{method:m,headers:{'Content-Type':'application/json'},body:b?JSON.stringify(b):undefined});let j={};try{j=await r.json()}catch(e){}return{ok:r.ok,s:r.status,j}};
const say=(id,t,ok)=>$(id).innerHTML=`<div class="msg ${ok?'ok':'er'}">${esc(t)}</div>`;
function tab(n){$('p1').classList.toggle('hide',n!=1);$('p2').classList.toggle('hide',n!=2);$('t1').classList.toggle('on',n==1);$('t2').classList.toggle('on',n==2);if(n==2)load()}
$('t1').onclick=()=>tab(1);$('t2').onclick=()=>tab(2);
function addItem(){const d=document.createElement('div');d.className='item';
d.innerHTML=`<select class="cat">${opt(CATS)}</select><input class="prod" placeholder="Produto" maxlength="100"><div class="row"><input class="qtd" type="number" step="any" min="0" inputmode="decimal" placeholder="Qtd"><select class="um">${opt(UM)}</select></div><input class="obs" placeholder="Observação (opcional)" maxlength="255"><button type="button" class="s">Remover</button>`;
d.querySelector('button').onclick=()=>d.remove();$('itens').appendChild(d)}
$('add').onclick=addItem;addItem();
api('/api/unidades').then(r=>{$('un').innerHTML=r.ok?r.j.map(u=>`<option value="${u.id}">${esc(u.nome)}</option>`).join(''):'<option>Erro ao carregar</option>'});
$('env').onclick=async()=>{
 const itens=[...document.querySelectorAll('.item')].map(d=>({categoria:d.querySelector('.cat').value,produto:d.querySelector('.prod').value,quantidade:d.querySelector('.qtd').value,unidade_medida:d.querySelector('.um').value,observacao:d.querySelector('.obs').value}));
 $('env').disabled=true;
 const r=await api('/api/solicitacoes','POST',{unidade_id:$('un').value,responsavel:$('resp').value,itens,observacoes_gerais:$('og').value});
 $('env').disabled=false;
 if(r.ok){say('m1',`Enviado! Protocolo: ${r.j.protocolo} (anote)`,1);$('itens').innerHTML='';addItem();$('og').value=''}else say('m1',r.j.error||'Erro ao enviar.',0)};
$('ent').onclick=async()=>{const r=await api('/api/login','POST',{usuario:$('u').value,senha:$('s').value});r.ok?load():say('m2',r.j.error||'Erro.',0)};
$('sair').onclick=async()=>{await api('/api/logout','POST');$('s').value='';load()};
async function load(){const r=await api('/api/admin/solicitacoes');
 if(r.s==401){$('lg').classList.remove('hide');$('ad').classList.add('hide');return}
 $('lg').classList.add('hide');$('ad').classList.remove('hide');
 $('lista').innerHTML=r.ok?(r.j.length?'':'<p>Nenhuma solicitação.</p>'):'<p>Erro ao carregar.</p>';
 (r.j||[]).forEach(s=>{const c=document.createElement('div');c.className='card';
 c.innerHTML=`<b>${esc(s.protocolo)}</b><br><small>${esc(s.unidade_nome)} · ${esc(s.responsavel)} · ${new Date(s.data_solicitacao).toLocaleString('pt-BR')}</small><ul>${s.solicitacao_itens.map(i=>`<li>${esc(i.produto)} — ${esc(i.quantidade)} ${esc(i.unidade_medida)} <small>(${esc(i.categoria)}${i.observacao?' · '+esc(i.observacao):''})</small></li>`).join('')}</ul>${s.observacoes_gerais?`<small>Obs: ${esc(s.observacoes_gerais)}</small>`:''}<select class="st">${ST.map(x=>`<option${x==s.status?' selected':''}>${x}</option>`).join('')}</select><textarea class="oa" rows="2" placeholder="Observação do admin">${esc(s.observacoes_admin||'')}</textarea><button class="p">Salvar</button>`;
 c.querySelector('button').onclick=async e=>{const x=await api('/api/admin/solicitacoes/'+s.id,'PATCH',{status:c.querySelector('.st').value,observacoes_admin:c.querySelector('.oa').value});e.target.textContent=x.ok?'Salvo ✓':'Erro';setTimeout(()=>e.target.textContent='Salvar',1500)};
 $('lista').appendChild(c)})}
</script></body></html>
